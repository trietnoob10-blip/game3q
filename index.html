body{margin:0;font-family:Arial,sans-serif;background:#12121c;color:#fff}

.the.song{animation:tho 2s ease-in-out infinite}

.hp i{display:block;height:5px;background:#22c55e;border-radius:3px}
.en{height:10px;position:relative}.en i{display:block;height:10px;background:#38bdf8;border-radius:3px}
.en b{position:absolute;left:0;right:0;top:0;font-size:8px;line-height:10px;text-align:center;font-weight:normal}
.bd{font-size:9px;min-height:11px}

.pop{position:fixed;font-weight:bold;font-size:12px;z-index:20;pointer-events:none;text-shadow:0 0 3px #000}
#nav{margin-top:auto;display:flex;gap:4px;padding:8px;background:#1d1d30;position:sticky;bottom:0}
#nav button{flex:1;font-size:11px;padding:10px 1px}
#ov{display:none;position:fixed;inset:0;background:#12121cf5;z-index:50;flex-direction:column;max-width:480px;margin:0 auto}
#hd{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#1d1d30;font-size:16px}
#nd{overflow:auto;flex:1;padding:10px;-webkit-overflow-scrolling:touch}
.ds{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:72px;text-align:center;border:2px solid #888;border-radius:8px;padding:4px;font-size:22px;background:#0004;cursor:pointer}
.chip small{display:block;font-size:10px}

.fg{display:grid;grid-template-columns:repeat(3,70px);gap:6px;justify-content:center;margin:8px 0}
.o{height:70px;border:2px dashed #666;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;cursor:pointer}
.o.sel{border-color:#fde047;background:#fde04722}

.sk{padding:8px;margin:4px 0;background:#ffffff12;border-radius:8px;cursor:pointer;font-size:14px}
.ic{display:inline-block;width:26px;height:26px;border:2px solid #fbbf24;border-radius:6px;text-align:center;line-height:22px;margin-right:6px}
table{width:100%;font-size:12px;border-collapse:collapse}td,th{padding:3px;border-bottom:1px solid #333;text-align:right}td:first-child,th:first-child{text-align:left}

function pTH(m){mo("🌾 Thu hoạch",'<div id="htxt" style="margin:8px 0"></div>'+(m?'<div class="msg">'+m+"</div>":"")+'<button onclick="thuHoach()">Nhận thu hoạch</button>');veTH()}
function veTH(){const e=$("htxt");if(!e)return;const p=phutTich();
 e.innerHTML="💰 Đã tích: <b>"+fmt(p*vph())+" vàng</b><br>⏱️ "+Math.floor(p/60)+" giờ "+p%60+" phút / tối đa 16 giờ<br>📈 Tốc độ: "+vph()+" vàng/phút (ải càng cao càng nhiều)"+(p>=TD?'<br><span class="msg">⚠️ Kho đã đầy, hãy nhận để tiếp tục tích!</span>':"")}
setInterval(veTH,1000);
function thuHoach(){const p=phutTich();if(p<1)return pTH("⏳ Chưa đủ 1 phút, đợi thêm nhé.");const v=p*vph();S.vang+=v;S.tg=Date.now();luu();hud();pTH("✅ Đã nhận "+fmt(v)+" vàng!")}

function pBalo(m){const l=H.filter(h=>S.sh[h.id]>0).sort(byT);
 mo("🎒 Balo",(m?'<div class="msg">'+m+"</div>":"")+(l.length?l.map(h=>'<div class="r"><span style="color:'+MAU[h.t]+'">'+h.e+" "+h.n+" ("+S.sh[h.id]+' mảnh)</span>'+(S.own[h.id]?"<small>Đã có tướng</small>":S.sh[h.id]>=10?'<button onclick="ghep(\''+h.id+'\')">Ghép</button>':"<small>Cần 10 mảnh</small>")+"</div>").join(""):"<p>Chưa có mảnh tướng.</p>"))}
function ghep(id){S.sh[id]-=10;S.own[id]={lv:1,b:0};luu();pBalo("✅ Đã ghép được tướng "+HM[id].n+"!")}
// Cho phép cài như ứng dụng (chỉ chạy khi mở bằng http/https, không chạy khi mở file trực tiếp)
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});
